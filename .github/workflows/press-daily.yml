name: Press scan (daily)

# Publisher feeds only hold their latest stories, so a fortnightly scan sees a
# sliver of the fortnight. This runs just the second press strand
# (pipeline/retrieve/press.ts) once a day; the full contestation pipeline
# stays fortnightly. Only on-topic items reach the classifier, so a quiet day
# costs nothing beyond a few feed fetches.
on:
  schedule:
    - cron: '30 21 * * *' # 07:30 AEST
  workflow_dispatch:

jobs:
  press:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Press feeds scan
        run: npm run pipeline -- --source press --limit 25 --write
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
      - name: Commit compute log
        if: always()
        run: |
          if ! git diff --quiet docs/compute-log.jsonl 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/compute-log.jsonl
            git commit -m "Compute log: daily press scan $(date -u +%Y-%m-%d)"
            git pull --rebase origin main && git push
          fi
