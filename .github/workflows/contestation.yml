name: Contestation pipeline

# Roughly fortnightly: the 1st and 15th at 06:00 UTC (cron has no native
# "every two weeks"). Plus a manual trigger.
on:
  schedule:
    - cron: '0 6 1,15 * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max items to process'
        default: '40'

jobs:
  run:
    runs-on: ubuntu-latest
    # Needed for the compute-log commit step below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci

      # GDELT is the wide-net news source. Items below the confidence threshold
      # are written but flagged for human review before anything is used in print.
      - name: GDELT scan (press coverage)
        run: npm run pipeline -- --source gdelt --limit ${{ github.event.inputs.limit || '40' }} --write
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Planning portals: the richest source for *new* projects and submissions.
      # Runs whether or not GDELT succeeded (independent source, own outages), and
      # no-ops quietly until the PORTAL_FEED_URL(S) secrets point at confirmed feeds.
      - name: Planning-portal scan (exhibition / submission windows)
        if: ${{ !cancelled() }}
        run: npm run pipeline -- --source portals --limit ${{ github.event.inputs.limit || '40' }} --write
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PORTAL_FEED_URLS: ${{ secrets.PORTAL_FEED_URLS }}
          PORTAL_FEED_URL: ${{ secrets.PORTAL_FEED_URL }}

      # QA self-review: writes nothing, reads the infra tracker and flags rows
      # that need a human eye (unverified sourcing, low confidence, unconfirmed
      # public-notice status, missing approval dates, stale rows, campus
      # double-counts). Report lands in the Actions run summary. Runs last and
      # never blocks the scans above.
      - name: QA self-review (flags rows for human review)
        if: always()
        run: npm run review
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      # Compute transparency: the scans above append their token usage to
      # docs/compute-log.jsonl (see docs/COMPUTE.md). Commit it so the public
      # log — surfaced on /glossary — stays complete.
      - name: Commit compute log
        if: always()
        run: |
          if ! git diff --quiet docs/compute-log.jsonl 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/compute-log.jsonl
            git commit -m "Compute log: pipeline run $(date -u +%Y-%m-%d)"
            git pull --rebase origin main && git push
          fi
